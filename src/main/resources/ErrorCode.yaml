ErrorCode:
  type: string
  enum:
    - BAD_REQUEST #400
    - NOT_FOUND #404
    - CONFLICT #409

ResponseCode:
  type: object
  required:
    - errorCode
    - errorDescription
    - statusCode
  properties:
    errorCode:
      $ref: '#/ErrorCode'
    errorDescription:
      type: string
    statusCode:
      type: integer