databaseChangeLog:
  - changeSet:
      id: 003-create-account-table
      author: Abdulatip
      preConditions:
        - onFail: MARK_RAN
          not:
            - tableExists:
                tableName: account
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account
                    nullable: false
              - column:
                  name: status_id
                  type: INT
                  constraints:
                    references: account_status(id)
                    foreignKeyName: fk_account_status
                    nullable: false
              - column:
                  name: client_id
                  type: uuid
                  constraints:
                    references: client(id)
                    foreignKeyName: fk_client
                    nullable: false
              - column:
                  name: account_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: currency_code
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: create_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: update_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false