databaseChangeLog:
  - changeSet:
      id: 007-shedlock
      author: Abdulatip
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: shedlock
      changes:
        - createTable:
            tableName: shedlock
            columns:
              - column:
                  name: name
                  type: varchar
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lock_until
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: locked_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: locked_by
                  type: varchar
                  constraints:
                    nullable: false