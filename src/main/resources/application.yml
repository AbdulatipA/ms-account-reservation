spring:
  liquibase:
    change-log: classpath:db/changelog/master.yaml
  application:
    name: ms-account-reservation
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: "health, threaddump"
  endpoint:
    shutdown:
      access: none
server:
  shutdown: graceful
  port: ${SERVER_PORT:8080}
app:
  currency-client:
    base-url: "https://v6.exchangerate-api.com"
    api-key: "f746aba9baf5a10cb9957495"
    enabled: true
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 20
    thread-name-prefix: "currency-async-"



