ClientResponse: #ответ на создание нового клиета
      type: object
      required:
        - id
        - fullName
        - citizenship
        - clientType
        - documentNumber
        - documentSeries
        - documentType
        - mdmCode
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        fullName:
          type: string
          example: "Иван Петров Сергеевич"
        citizenship:
          type: string
          example: "Российская Федерация"
        clientType:
          type: string
          example: "INDIVIDUAL"
        documentNumber:
          type: string
          example: "1234"
        documentSeries:
          type: string
          example: "123456"
        documentType:
          type: string
          example: "PASSPORT"
        mdmCode:
          type: integer
          format: int64
          example: 987654321
        status:
          $ref: './ClientStatus.yaml#/ClientStatus'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"

        hasAccounts:
          type: boolean
          default: false
          example: false
