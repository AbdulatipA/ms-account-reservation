ClientResponse:
      type: object
      description: "Ответ на создание нового клиента"
      required:
        - id
        - fullName
        - citizenship
        - clientType
        - documentNumber
        - documentSeries
        - documentType
        - mdmCode
        - status
        - createdAt
        - updatedAt
        - hasAccounts
        - accounts
      properties:
        id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        fullName:
          type: string
          example: "Иван Петров Сергеевич"
        citizenship:
          type: string
          example: "Российская Федерация"
        clientType:
          type: string
          example: "INDIVIDUAL"
        documentNumber:
          type: string
          example: "1234"
        documentSeries:
          type: string
          example: "123456"
        documentType:
          type: string
          example: "PASSPORT"
        mdmCode:
          type: integer
          format: int64
          example: 987654321
        status:
          $ref: './ClientStatus.yaml#/ClientStatus'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        hasAccounts:
          type: boolean
          default: false
          example: false
        accounts:
          type: array
          description: "Список всех счетов клиента"
          items:
            $ref: '#/AccountResponseForClient'

AccountResponseForClient:
  type: object
  required:
    - accountNumber
    - currencyCode
    - balance
    - status
  properties:
    accountNumber:
      type: string
      description: "номер счета"
      example: "40817810000000001234"
    currencyCode:
      type: string
      description: "валюта"
      example: "EUR"
    balance:
      type: number
      description: "балас"
      format: double
      example: 152000.30
    status:
      type: string
      description: статус счета
      example: "NEW"
