GetClients:
  type: object
  required:
    - content
    - pageable
  properties:
    content:
      type: array
      items:
        type: object
        required:
          - id
          - fullName
          - status
        properties:
          id:
            type: string
            format: uuid
            example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
          fullName:
            type: string
            example: "Иван Петров Сергеевич"
          status:
            $ref: './ClientStatus.yaml#/ClientStatus'
    pageable:
      type: object
      required:
      - pageNumber
      - pageSize
      - totalPages
      - totalElements
      properties:
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 20
        totalPages:
          type: integer
          example: 1
        totalElements:
          type: integer
          example: 1

